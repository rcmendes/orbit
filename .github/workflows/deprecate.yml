name: Deprecate npm version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to deprecate
        required: true
        default: 0.8.0
      message:
        description: Deprecation warning
        required: true
        default: Broken Windows CI; use 0.8.1.

permissions:
  contents: read

jobs:
  deprecate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Deprecate
        run: npm deprecate "@rcmendes/orbit@${{ inputs.version }}" "${{ inputs.message }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
