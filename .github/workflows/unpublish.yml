name: Unpublish npm version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to unpublish
        required: true
        default: 0.8.0

permissions:
  contents: read

jobs:
  unpublish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Unpublish
        run: npm unpublish "@rcmendes/orbit@${{ inputs.version }}" --force
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
