[package]
name = "orbit-tracker"
version = "0.10.7"
edition = "2024"
rust-version = "1.89"
description = "A Git-native issue tracker and atomic work queue for coding agents"
license = "Apache-2.0"
repository = "https://github.com/rcmendes/orbit"
readme = "README.md"

[features]
default = ["github-provider"]
github-provider = []

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
dunce = "1.0"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
tempfile = "3"
toml = "1"

[dev-dependencies]
proptest = "1"

[profile.release]
lto = true
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
